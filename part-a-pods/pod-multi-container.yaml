apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
spec:
  containers:
    - name: app-container
      image: busybox
      command:
        - sh
        - -c
        - "while true; do echo App container running; sleep 10; done"

    - name: sidecar-container
      image: busybox
      command:
        - sh
        - -c
        - "while true; do echo Sidecar container running; sleep 10; done"
